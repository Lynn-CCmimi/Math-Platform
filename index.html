<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A-Level 数学练习</title>
<link rel="stylesheet" href="assets/style.css?v=1c6f4885">
<script src="config.js"></script>
</head>
<body>

<div id="gate" class="login" hidden>
  <h1>A-Level 数学练习</h1>
  <p class="hint">用老师给你的用户名和密码登录</p>
  <input id="username" placeholder="用户名" autocomplete="username"
         autocapitalize="off" autocorrect="off">
  <input id="password" type="password" placeholder="密码" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="act" id="loginBtn">登录</button>
</div>

<div id="shell" hidden>
  <header>
    <div class="bar">
      <span class="brand">A-Level 数学</span>
      <select id="unit"></select>
      <div class="tabs">
        <div class="tab" id="tabPractice" role="tab" aria-selected="true">练习</div>
        <div class="tab" id="tabBook" role="tab" aria-selected="false">教材</div>
        <div class="tab" id="tabWork" role="tab" aria-selected="false">作业</div>
        <div class="tab" id="tabMock" role="tab" aria-selected="false">模拟卷</div>
        <div class="tab" id="tabWrong" role="tab" aria-selected="false">错题本</div>
      </div>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button class="plain" id="logout">退出</button>
    </div>
  </header>

  <main>
    <section id="viewPractice">
      <div id="assignBar"></div>
      <div class="chips" id="topics"></div>
      <div class="split">
        <div class="list" id="qlist"></div>
        <div class="card" id="qpanel"><div class="empty">从左边选一道题</div></div>
      </div>
    </section>

    <section id="viewWork" hidden>
      <div id="workList"></div>
    </section>

    <section id="viewMock" hidden>
      <div class="card" style="margin-bottom:14px">
        <div class="row">
          <select id="mockUnit"></select>
          <button class="act" id="mockGen">生成一套</button>
          <span class="hint" id="mockHint"></span>
        </div>
        <div class="hint" style="margin-top:8px">
          按真卷的题数、分值走势和知识点比例，从不同年份的真题里各抽一道拼成一套 75 分的卷子。
          做完一题对一题答案，填自己拿了几分，做完全部出总分。
        </div>
      </div>
      <div id="mockList"></div>
    </section>

    <section id="viewBook" hidden>
      <div class="split">
        <div class="list" id="chapters"></div>
        <div class="card" id="bpanel"><div class="empty">从左边选一节</div></div>
      </div>
    </section>

    <section id="viewWrong" hidden>
      <div class="chips" id="wrongFilter"></div>
      <div id="wrongList"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="assets/app.js?v=1c6f4885"></script>
</body>
</html>
